buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Wise Maven repo: com.wise.sdk:core and the pinned Zoom SDK it depends on.
allprojects {
    repositories {
        maven { url 'https://wise-maven.s3.ap-south-1.amazonaws.com/android/releases' }
    }
}

apply plugin: "com.facebook.react.rootproject"
